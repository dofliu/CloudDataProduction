# 自動驗證:場景健全性 + 前端建置 + 動畫 ↔ 模擬資料一致性
#
# 分成三個 job,快的先擋、慢的後跑:
#   scenario  純 Python,幾十秒。
#   web       tsc + vite build,一兩分鐘。
#   animation 要開瀏覽器逐幀讀 three.js 場景座標,約十分鐘(runner 是軟體渲染)。
#             跑在 PR、手動觸發、以及 main 的 push;功能分支的每次 push 不跑,
#             免得推一次就燒十幾分鐘 —— 開 PR 時一定會擋一次。
#
# 觸發只掛 main 的 push 與 pull_request:功能分支推上去時 PR 的 synchronize
# 已經會跑一輪,若 push 也收 `claude/**` 會讓同一顆 commit 跑兩次。
#
# 三套測試的內容見 tests/animation/README.md 與 docs/animation_binding.md。

name: verify

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 場景健全性:每一間工廠、每一台設備都跑得起來、資料合理、畫得出來 ──
  scenario:
    name: 場景健全性(逐廠逐台)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 只裝引擎跑場景真正需要的兩個套件 —— 不用整份 requirements.txt(含 pymodbus /
      # asyncua / fastapi),那些是協定層與 API 層,場景驗證用不到。
      - run: pip install numpy PyYAML
      - name: verify_scenario
        run: python3 tests/animation/verify_scenario.py
      # 輸入控制:CNC 刻字文字 / 手臂取放點,寫 setpoint 後引擎輸出真的跟著變
      - name: verify_input_control
        run: python3 tests/test_input_control.py

  # ── 前端型別 + 建置 ──────────────────────────────────────
  web:
    name: 前端 tsc + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  # ── 動畫 ↔ 模擬資料一致性(開真的瀏覽器讀場景世界座標)──
  animation:
    name: 動畫一致性(35 項)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [scenario, web]
    # PR / 手動觸發一定跑;push 只在 main 上跑(功能分支靠開 PR 時擋)。
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安裝引擎相依
        run: pip install numpy PyYAML
        working-directory: ${{ github.workspace }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: 安裝 Chromium(playwright)
        run: npx playwright install --with-deps chromium

      # 從真實引擎錄兩份 telemetry(slow ×1 / fast ×120),餵給瀏覽器逐幀比對
      - name: 擷取引擎 telemetry(真實模擬,非 mock)
        run: python3 tests/animation/capture_frames.py web/preview
        working-directory: ${{ github.workspace }}

      - name: 起 dev server
        run: |
          # nohup + 背景:後續 step 是另一個 shell,vite 必須脫離本 step 才活得下去
          nohup npx vite --port 5173 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:5173/preview/verify.html && exit 0
            sleep 1
          done
          echo "dev server 沒起來:"; cat /tmp/vite.log; exit 1

      # 離線資源回歸的第一道防線:3D 層不得依賴任何 CDN
      # (drei 的 <Environment preset> 會抓 .hdr、<Text> 會抓字型資料,
      #  校內 LAN 無外網時會讓整個 Canvas 崩掉)
      - name: 3D 層無 CDN 相依 / 無 console error
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/shots"
          node preview/shot3d.mjs "$GITHUB_WORKSPACE/artifacts/shots" | tee /tmp/shot3d.out
          grep -q "OK no page errors" /tmp/shot3d.out || {
            echo "::error::3D 預覽出現 console error / pageerror(可能是又引入了 CDN 資源)"
            exit 1
          }

      # 廠內產線視圖:製程佈局(上游 → 手臂 → 出料)也要畫得出來且無 console error
      - name: 產線佈局視圖
        run: |
          node preview/shotline.mjs "$GITHUB_WORKSPACE/artifacts/shots" | tee /tmp/shotline.out
          grep -q "OK no page errors" /tmp/shotline.out || {
            echo "::error::產線視圖出現 console error / pageerror"
            exit 1
          }

      - name: 動畫 ↔ 模擬資料一致性(35 項)
        run: node tests/animation/verify_animation.mjs
        working-directory: ${{ github.workspace }}

      - name: 失敗時上傳畫面
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: animation-shots
          path: artifacts/shots
          if-no-files-found: ignore
