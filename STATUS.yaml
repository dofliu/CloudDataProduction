description: "2D virtual industrial park teaching platform: simulation engine emits realistic (synthetic, ground-truth-labelled) equipment data over Modbus/OPC-UA/MQTT for students to monitor, diagnose, and build predictive maintenance models."
description_zh: "虛擬 2D 工業園區教學平台:模擬引擎產生擬真(合成且帶 ground-truth 標籤)設備數據,經 Modbus/OPC-UA/MQTT 暴露,供學生監控、處置故障與訓練預測性維護模型。"
key_metrics: "課堂版 65 廠 / 154 設備 / 12 條產線 / 32 條跨公司供應鏈,示範版 37 廠 / 85 設備 / 6 條產線(皆由 scenarios/scripts/gen_*.py 產生);11 產業 template(半導體腔體 particle/良率、電表 三相/功因、沖壓機 噸位/毛邊、熱處理爐 爐溫/均勻性);3 協定 + multi_port(6xxx 埠);四種 object type(holding FC03 / discrete input FC02 / input register FC04 含 ×100 定點鏡像 / coil FC01 讀+FC05 寫,學生唯讀、教師可寫);SQLite 雙庫持久化(telemetry + 工單/預測/OEE/認領,重啟不歸零);確定性種子(每學號可重現資料)+ 作業範本(私有測試集 + 自動評分 + 線上活廠驗收,防 AI 代寫);資料可訓練性實證(held-out F1 0.95 / RUL R² 0.94);學生面(認領→工單→競賽榜);學生任務中心「開始」分頁(故事引導 + 真實狀態自動打勾的任務進度 + 依認領設備自動產生可執行的 Modbus/OPC-UA/MQTT 個人化連線包);上線硬化(venv + 看門狗 + /api/health + smoke test);產線編排 + 廠內人員;OEE/災難日/UI建廠;壓測 200 WS 零錯誤;學生決策層(工單結案要選對處置動作、預防保養停機換壽命、託管告警規則對 ground-truth 算 F1);資料的一生九關 + 全班 N×9 進度熱力圖 + 協定端存取軌跡;課堂即時互動(倒數截止 / 首答留名 / 全班投票收票後真的照多數決動引擎);跨公司供應鏈(上游停→下游餓料、下游滿→上游阻塞,自給率量化單一供應商風險);前端 UI 全面重設計(深色工業風 tokens + IBM Plex 字體 + 全域燈號摘要 + 側欄門檻條;學生/目錄/戰情/OEE/教師五頁卡片化;2.5D 世界照設計稿改等距金屬量體——三面漸層立方體 + 窗格網建築 + 發光機台);離線教材資料包(make_offline_pack 一週乾淨基線 Plan B、make_week_packs 逐週凍結包含產後驗證與教師答案卷,平台不在線也不影響已發教材);課程週次對齊《18週教學大綱 v2.1》、correlation 批改改時間戳對齊、production 生產管理 KPI 自動批改(準交率 / WIP)"
