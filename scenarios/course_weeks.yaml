# 雲端生產數據導論 —— 每週情境定義(教師手動套用)。
#
# 教師在教師控制台按「套用第 N 週情境」→ 平台據此設定當週的:
#   - faults        : 異常條件(clear=全部修復正常 / keep=沿用上週 / dict=注入指定異常)
#   - order_density : 訂單密度(light/normal/high → 設備稼動率,影響待機/退化/OEE)
# 並記錄「資料窗起點」(套用當下的 sim_t / wall_t),供作業自動比對界定「這週的資料」。
#
# 對應課程規劃(docs/課程規劃_18週.md)。18 週全定義(2026-08-04 T2):停課 / 不動平台的週
# 明確標 keep,教師誤按「套用」也只是重記資料窗,不會改變異常條件。
#
# fault dict 欄位:
#   policy: spread              # 目前僅 spread
#   scope:  all_companies|random
#   count:  每間公司(all_companies)或全園區(random)挑幾台 producer 設備
#   kind:   equipment(退化元件→設備故障) | sensor(感測器資料品質問題)
#   type:   gradual/sudden/... (equipment) 或 sensor_drift/sensor_stuck/sensor_bias (sensor)
#   severity: 0..1
#
# 週次 ↔ 作業 ↔ 課堂練習的對應(2026-08-04 T2 新增,凍結包與活廠共用同一張表):
#   submissions: 當週作業用到的自動批改 type(api/submissions.py 的 grader)
#   exercises:   當週建議的課堂即時練習 id(scenarios/classroom_exercises.yaml)
#   兩欄皆選填;engine/course.py 只讀 faults / order_density,多的欄位不影響套用。
#   對應關係由 tests/test_course_grading.py 驗證(id / type 必須真的存在)。

course:
  name: "雲端生產數據導論"
  default_tolerance: 0.10        # 統計類作業預設相對誤差容差(±10%)

  # 週次編號對齊《18週教學大綱 v2.1》(2026-08-01 依教材端事實查核重編;
  # 教師是按「套用第 N 週情境」操作,編號錯 = 當天全班拿到錯的資料):
  #   舊 5→6、舊 7→7(faults 由 keep 改 clear ★)、舊 6→8、舊 8→10、舊 10→11、舊 11→12、舊 13→14
  weeks:
    - week: 1
      title: "課程導論 + 園區導覽"
      faults: clear              # 導覽 demo 要看到健康光鮮的園區
      order_density: normal
      exercises: [warmup_healthy]

    - week: 2
      title: "認領 + 設備目錄 + 協定接取(發整合①)"
      faults: clear              # 學生第一次連線,資料要乾淨
      order_density: normal
      submissions: [connect]
      exercises: [warmup_healthy]

    - week: 3
      title: "(停課)整合①作業進行週"
      faults: keep               # 學生在家做整合①,平台條件不動(不設 order_density = 不動)

    - week: 4
      title: "平台啟用:正常運轉 + 敘述統計"
      faults: clear              # 全部修復,呈現健康基線
      order_density: normal
      submissions: [connect, stats]
      exercises: [threshold_count]   # count_over 學生自帶門檻(W4 §4.3 教學點)

    - week: 5
      title: "(停課)整合②作業進行週"
      faults: keep               # ★ 學生在家抓「一週正常資料」,必須沿用 W4 乾淨基線,絕不能動

    - week: 6
      title: "正常運轉統計"
      faults: clear              # 乾淨基線 —— 整合作業②的 ground-truth 建立在這週
      order_density: normal
      submissions: [stats]
      exercises: [threshold_count]

    - week: 7
      title: "時序聚合"
      faults: clear              # ★ 必須乾淨:學生本週存下的「正常基線」是 W8 的比較對象
      order_density: normal
      submissions: [aggregate]

    - week: 8
      title: "明顯異常(設備退化)"
      order_density: high        # 多投工單,設備忙、退化明顯
      submissions: [anomaly]
      exercises: [real_degradation]
      faults:
        policy: spread
        scope: all_companies     # 每間公司挑 1 台注入明顯設備故障
        count: 1
        kind: equipment
        type: gradual
        severity: 0.85           # 明顯、好判讀(W8 講義六張圖以此為準,勿改)

    - week: 9
      title: "期中評量(個人)"
      faults: clear              # 期中週全園區乾淨穩定(現場 demo 不出意外);
      order_density: normal      # 「正常週 vs 異常週」比較用 W7 / W8 的歷史資料即可
      submissions: [connect, stats]

    - week: 10
      title: "感測器資料品質"
      order_density: normal
      submissions: [correlation, root_cause]
      exercises: [sensor_vs_equipment, correlation]
      faults:
        policy: spread
        scope: all_companies     # 每間公司挑 1 台注入感測器漂移(讀值脫鉤真實,health 仍乾淨)
        count: 1
        kind: sensor
        type: sensor_drift
        severity: 0.6

    - week: 11
      title: "即時串流與事件"
      faults: keep               # 沿用上週,讓學生訂閱事件、計 done 工單數
      order_density: high        # 多投單 → 更多完工事件可數
      submissions: [events]

    - week: 12
      title: "生產 KPI / OEE"
      faults: clear              # 回到正常,聚焦產能/稼動/良率的 KPI 計算
      order_density: high
      submissions: [oee, production]
      exercises: [oee_basics]

    - week: 13
      title: "跨產業比較(發整合③)"
      faults: keep               # 維持 W12 乾淨;W14 套用時才注入緩退化(RUL 趨勢窗一週)
      order_density: normal

    - week: 14
      title: "趨勢與預警(RUL)"
      order_density: normal
      submissions: [rul]
      exercises: [real_degradation]
      faults:
        policy: spread
        scope: all_companies     # 較緩的漸進退化,讓學生在故障前抓趨勢做預警
        count: 1
        kind: equipment
        type: gradual
        severity: 0.5

    - week: 15
      title: "視覺化進階 + 期末專題啟動"
      faults: clear              # 專題期從乾淨狀態起跑
      order_density: high        # 訂單開高:資料豐富、KPI 有變化,各組專題有東西可分析

    - week: 16
      title: "(停課)期末專題自主進行"
      faults: keep               # 平台照常跑,各組自己抓資料

    - week: 17
      title: "(停課)期末專題自主進行"
      faults: keep

    - week: 18
      title: "期末評量:專題發表"
      faults: keep               # 發表日不動平台,各組 demo 自己追蹤的東西
